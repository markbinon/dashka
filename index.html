<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030207">
<title>тебе письмо</title>
<style>
@font-face {
  font-family: "sf pro expanded";
  src: url("./sf-pro-expanded-regular.ttf") format("truetype");
  font-style: normal;
  font-weight: 400;
  font-display: swap;
}
:root {
  color-scheme: dark;
  --bg: #030207;
  --pink: #ff6c9e;
  --pink-light: #ffd5e5;
  --violet: #a88aff;
  --ease: cubic-bezier(.22, 1, .36, 1);
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100svh;
  overflow-x: hidden;
  background: var(--bg);
  color: #fff5fb;
  font-family: "sf pro expanded", -apple-system, blinkmacsystemfont, sans-serif;
  -webkit-font-smoothing: antialiased;
}
body::before, body::after {
  content: "";
  position: fixed;
  pointer-events: none;
  inset: -20%;
  z-index: 0;
}
body::before {
  /* до появления сердца экран остаётся почти абсолютно чёрным. */
  opacity: 0;
  background:
    radial-gradient(ellipse at 50% 42%, rgba(255, 20, 122, .72), transparent 34%),
    radial-gradient(ellipse at 18% 22%, rgba(105, 45, 255, .62), transparent 38%),
    radial-gradient(ellipse at 84% 76%, rgba(0, 225, 255, .38), transparent 35%),
    radial-gradient(ellipse at 50% 100%, rgba(255, 54, 197, .42), transparent 45%);
  filter: blur(42px) saturate(1.65);
  transform: scale(.92);
  transition: opacity 1.25s ease .55s, filter 1.4s ease .55s;
}
body.opened-page::before {
  opacity: 1;
  filter: blur(42px) saturate(1.8);
  animation: neondrift 8s ease-in-out .55s infinite alternate;
}
body::after {
  inset: 0;
  opacity: .12;
  background-image: url("data:image/svg+xml,%3csvg viewbox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3e%3cfilter id='n'%3e%3cfeturbulence type='fractalnoise' basefrequency='.85' numoctaves='3' stitchtiles='stitch'/%3e%3c/filter%3e%3crect width='100%25' height='100%25' filter='url(%23n)' opacity='.3'/%3e%3c/svg%3e");
  mix-blend-mode: screen;
}
.stage {
  position: relative;
  z-index: 2;
  min-height: 100svh;
  width: 100%;
  padding: max(24px, env(safe-area-inset-top)) 18px max(28px, env(safe-area-inset-bottom));
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  isolation: isolate;
}
.eyebrow {
  margin: 0 0 18px;
  font-size: clamp(11px, 2.8vw, 13px);
  font-weight: 400;
  letter-spacing: .32em;
  text-transform: uppercase;
  color: rgba(255, 222, 238, .78);
  transition: opacity .5s ease, transform .7s var(--ease);
}
.hint {
  margin: 20px 0 0;
  color: rgba(255, 223, 238, .55);
  font-size: 10px;
  letter-spacing: .22em;
  text-transform: uppercase;
  animation: hintpulse 2.4s ease-in-out infinite;
  transition: opacity .7s ease, transform .8s var(--ease);
}
.scene {
  position: relative;
  width: min(92vw, 440px);
  height: min(112vw, 510px);
  min-height: 350px;
  max-height: 510px;
  flex: none;
  display: grid;
  place-items: center;
  perspective: 1100px;
}
.halo {
  position: absolute;
  width: 88%;
  aspect-ratio: 1;
  top: 14%;
  left: 6%;
  border-radius: 50%;
  background: radial-gradient(circle, rgba(255, 81, 147, .42), rgba(172, 95, 255, .18) 42%, transparent 70%);
  filter: blur(24px);
  opacity: 0;
  transition: opacity 1s ease .55s;
}
.envelope {
  position: absolute;
  z-index: 5;
  width: min(84vw, 340px);
  aspect-ratio: 1.48;
  top: 39%;
  left: 50%;
  transform: translate(-50%, -50%);
  cursor: pointer;
  filter: drop-shadow(0 26px 38px rgba(0,0,0,.4));
  transition: transform 1.05s var(--ease) .35s, opacity .7s ease .65s, filter .5s ease;
  -webkit-tap-highlight-color: transparent;
}
.envelope:focus-visible { outline: 2px solid var(--pink-light); outline-offset: 10px; border-radius: 12px; }
.env-back, .env-front, .env-flap, .env-fold { position: absolute; inset: 0; border-radius: 9px; }
.env-back {
  background: linear-gradient(145deg, #e8bdce, #9c587d 95%);
  box-shadow: inset 0 1px rgba(255,255,255,.65);
}
.letter {
  position: absolute;
  left: 8%; top: 7%; width: 84%; height: 82%;
  border-radius: 6px;
  background: linear-gradient(150deg, #fff7fb, #f5cfe0);
  box-shadow: 0 4px 16px rgba(41, 9, 35, .2);
  transform: translatey(0);
  transition: transform 1s var(--ease) .15s;
}
.letter::before, .letter::after {
  content: ""; position: absolute; left: 18%; right: 18%; height: 2px;
  border-radius: 4px; background: rgba(176, 89, 130, .18);
}
.letter::before { top: 35%; }
.letter::after { top: 46%; left: 28%; right: 28%; }
.env-front {
  z-index: 2;
  background: linear-gradient(135deg, #fce5ee 0%, #e9b8cf 100%);
  clip-path: polygon(0 0, 50% 57%, 100% 0, 100% 100%, 0 100%);
}
.env-fold {
  z-index: 3;
  background: linear-gradient(145deg, #f7dbe8, #d99ab8);
  clip-path: polygon(0 100%, 50% 48%, 100% 100%);
}
.env-flap {
  z-index: 4;
  height: 58%;
  transform-origin: 50% 0;
  background: linear-gradient(160deg, #fff0f5, #dba5bd);
  clip-path: polygon(0 0, 100% 0, 50% 100%);
  backface-visibility: hidden;
  transition: transform .82s var(--ease) .08s, filter .5s ease;
}
.seal {
  position: absolute;
  z-index: 6;
  left: 50%; top: 54%;
  width: 20%; aspect-ratio: 1;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  display: grid; place-items: center;
  background: radial-gradient(circle at 32% 25%, #ffb0cd, #f34883 47%, #a51d59);
  box-shadow: 0 6px 17px rgba(103, 9, 53, .35), inset 0 2px 4px rgba(255,255,255,.55), inset 0 -5px 8px rgba(95, 0, 39, .25);
  transition: opacity .3s ease, transform .5s var(--ease);
}
.seal svg { width: 48%; fill: #fff0f7; filter: drop-shadow(0 1px 1px rgba(100,0,35,.3)); }
.envelope:hover { filter: drop-shadow(0 30px 44px rgba(255, 55, 135, .18)); }
.envelope:hover .seal { transform: translate(-50%, -50%) scale(1.07); }
.opened .eyebrow { opacity: 0; transform: translatey(-16px); pointer-events: none; }
/* подсказка гарантированно исчезает: отключаем её пульсацию, которая мешала fade-out. */
.opened .hint { animation: none; opacity: 0; transform: translatey(-18px) scale(.96); pointer-events: none; }
.opened .envelope { transform: translate(-50%, 75%) scale(.82) rotate(-5deg); opacity: 0; pointer-events: none; }
.opened .env-flap { transform: rotatex(180deg); filter: brightness(.72); }
.opened .letter { transform: translatey(-28%); }
.opened .seal { opacity: 0; transform: translate(-50%, -50%) scale(.25) rotate(25deg); }
.opened .halo { animation: halobloom 2.2s var(--ease) .55s both; }

/* сердце — отдельная сцена, появляется первой. */
.art {
  position: absolute;
  inset: 0;
  z-index: 3;
  pointer-events: none;
}
.heart-scene {
  position: absolute;
  width: 48%;
  left: 26%;
  top: 14%;
  opacity: 0;
  transform: translatey(22px) scale(.72) rotate(-8deg);
  transform-origin: center;
  filter: drop-shadow(0 0 16px rgba(255, 74, 139, .22));
}
.heart-svg { display: block; width: 100%; overflow: visible; }
.heart-fill { opacity: 0; }
.heart-outline {
  fill: none;
  stroke: rgba(255, 224, 238, .95);
  stroke-width: 1.35;
  stroke-linecap: round;
  stroke-linejoin: round;
  stroke-dasharray: 1;
  stroke-dashoffset: 1;
}
.opened .heart-scene {
  animation: heartarrive 1s var(--ease) .55s forwards, heartfloat 4s ease-in-out 2.1s infinite;
}
.opened .heart-outline { animation: traceheart .95s ease .68s forwards; }
.opened .heart-fill { animation: fillheart .65s ease 1.3s forwards; }

/* цветы начинаются только после завершения появления сердца + пауза около секунды. */
.bouquet {
  position: absolute;
  inset: 0;
  opacity: 0;
  transform: translatey(28px) scale(.82);
  transform-origin: 50% 38%;
}
.flower {
  position: absolute;
  width: var(--size);
  left: var(--x); top: var(--y);
  transform: translate(-50%, -50%) scale(.1) rotate(var(--rot));
  opacity: 0;
  filter: drop-shadow(0 5px 7px rgba(0,0,0,.16));
  transform-origin: center;
}
.flower svg { display: block; width: 100%; overflow: visible; }
.flower .petal-a { fill: var(--c1); }
.flower .petal-b { fill: var(--c2); }
.flower .center { fill: #ffd99b; stroke: rgba(255,255,255,.55); stroke-width: 1; }
.flower .sparkle { fill: rgba(255,255,255,.75); }
.opened .bouquet {
  animation: bouquetarrive 1.25s var(--ease) 2.55s forwards;
}
.opened .flower {
  animation: flowerbloom 1.05s var(--ease) calc(2.72s + var(--delay)) forwards;
}
.stem-art {
  position: absolute; inset: 0; width: 100%; height: 100%;
}
.stem-line {
  fill: none; stroke: #8fc7a5; stroke-width: 2.1; stroke-linecap: round;
  stroke-dasharray: 1; stroke-dashoffset: 1;
}
.opened .stem-line { animation: drawstem 1.05s ease 2.75s forwards; }
.leaf-shape { fill: #6fae8b; opacity: 0; transform-box: fill-box; transform-origin: center; }
.opened .leaf-shape { animation: leafbloom .65s var(--ease) 3.25s forwards; }

/* акриловая надпись — единственный текст, остающийся после открытия. */
.love {
  position: absolute;
  z-index: 10;
  left: 50%;
  top: 78%;
  width: min(94vw, 520px);
  margin: 0;
  text-align: center;
  font-size: clamp(26px, 7.4vw, 41px);
  line-height: 1.35;
  font-weight: 400;
  letter-spacing: -.065em;
  color: rgba(255, 245, 251, .94);
  opacity: 0;
  transform: translate(-50%, 20px) scale(.97);
  white-space: nowrap;
  pointer-events: none;
  background: linear-gradient(100deg, rgba(255,255,255,.8), #ffe0ef 30%, #fff 52%, #f3b6d4 72%, rgba(255,255,255,.88));
  background-size: 220% 100%;
  background-clip: text;
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  filter: drop-shadow(0 0 10px rgba(255, 91, 157, .42)) drop-shadow(0 0 28px rgba(171, 91, 255, .24));
}
/* у надписи нет подложки — только светящиеся буквы. */
.love::after { display: none; }
.opened .love {
  animation: textglass 1.25s var(--ease) 3.35s forwards, textshimmer 5s ease-in-out 4.7s infinite;
}
.particle-layer { position: fixed; inset: 0; z-index: 20; pointer-events: none; overflow: hidden; }
.particle {
  position: absolute;
  width: var(--s); height: var(--s);
  left: var(--x); top: var(--y);
  border-radius: 50%;
  background: radial-gradient(circle, #fff 0%, #ffd5e8 28%, rgba(255,105,165,0) 72%);
  box-shadow: 0 0 13px rgba(255, 114, 174, .75);
  opacity: 0;
  animation: particlerise var(--dur) ease-out var(--delay) forwards;
}
@keyframes neondrift {
  0% { transform: translate3d(-2%, 1%, 0) scale(1); background-position: 0% 50%; }
  50% { transform: translate3d(2%, -2%, 0) scale(1.1); }
  100% { transform: translate3d(-1%, 2%, 0) scale(1.04); }
}
@keyframes hintpulse { 0%,100% { opacity:.45 } 50% { opacity:.9 } }
@keyframes halobloom { 0% { opacity:.35; transform:scale(.65) } 50% { opacity:1 } 100% { opacity:.85; transform:scale(1.12) } }
@keyframes heartarrive {
  0% { opacity:0; transform:translatey(22px) scale(.72) rotate(-8deg); }
  65% { opacity:1; transform:translatey(-3px) scale(1.07) rotate(2deg); }
  100% { opacity:1; transform:translatey(0) scale(1) rotate(0); }
}
@keyframes traceheart { to { stroke-dashoffset:0; } }
@keyframes fillheart { from { opacity:0; transform:scale(.85); } to { opacity:1; transform:scale(1); } }
@keyframes heartfloat { 0%,100% { translate:0 0; } 50% { translate:0 -7px; } }
@keyframes bouquetarrive { from { opacity:0; transform:translatey(28px) scale(.82); } to { opacity:1; transform:translatey(0) scale(1); } }
@keyframes flowerbloom {
  0% { opacity:0; transform:translate(-50%,-50%) scale(.1) rotate(calc(var(--rot) - 28deg)); }
  70% { opacity:1; transform:translate(-50%,-50%) scale(1.12) rotate(calc(var(--rot) + 4deg)); }
  100% { opacity:1; transform:translate(-50%,-50%) scale(1) rotate(var(--rot)); }
}
@keyframes drawstem { to { stroke-dashoffset:0; } }
@keyframes leafbloom { from { opacity:0; scale:.2; } to { opacity:1; scale:1; } }
@keyframes textglass {
  0% { opacity:0; transform:translate(-50%, 20px) scale(.97); filter:blur(9px) drop-shadow(0 0 0 rgba(255,91,157,0)); }
  70% { opacity:1; filter:blur(0) drop-shadow(0 0 22px rgba(255,91,157,.25)); }
  100% { opacity:1; transform:translate(-50%, 0) scale(1); filter:blur(0) drop-shadow(0 0 18px rgba(255,91,157,.18)); }
}
@keyframes glassplate { from { opacity:0; transform:scale(.94); } to { opacity:1; transform:scale(1); } }
@keyframes textshimmer {
  0%, 70%, 100% { background-position:100% 50%; }
  85% { background-position:0% 50%; }
}
@keyframes particlerise {
  0% { opacity:0; transform:translatey(12px) scale(.4); }
  15% { opacity:.9; }
  100% { opacity:0; transform:translatey(-100px) scale(1.2); }
}
@media (max-width: 380px) {
  .scene { width: 94vw; height: 114vw; min-height: 330px; }
  .love { font-size: clamp(23px, 6.8vw, 31px); }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: .01ms !important; animation-delay: 0s !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
}

/* falling memory cards: start with the heart, then drift in a seamless loop. */
.memory-rain {
  position: fixed; inset: 0; overflow: hidden; pointer-events: none;
  z-index: 1; opacity: 0; transition: opacity 1.5s ease 1.05s;
}
body.opened-page .memory-rain { opacity: 1; }
.memory-card {
  position: absolute; top: -34vh; left: var(--left);
  width: clamp(82px, var(--width), 158px);
  padding: 3px; border: 1px solid rgba(255, 126, 177, .78);
  border-radius: 3px; background: rgba(255, 226, 239, .08);
  box-shadow: 0 0 9px rgba(255, 93, 158, .12);
  opacity: .84; transform: rotate(var(--tilt));
  animation: memoryfall var(--duration) linear var(--delay) infinite;
  animation-play-state: paused; will-change: transform;
}
body.opened-page .memory-card { animation-play-state: running; }
.memory-card img {
  display: block; width: 100%; height: auto; max-height: 190px;
  object-fit: contain; border-radius: 1px;
}
@keyframes memoryfall {
  0% { transform: translate3d(0, -10vh, 0) rotate(var(--tilt)); }
  100% { transform: translate3d(var(--drift), 145vh, 0) rotate(calc(var(--tilt) + 18deg)); }
}
@media (max-width: 600px) {
  .memory-card { width: clamp(68px, var(--width), 112px); padding: 2px; opacity: .72; }
  .memory-card img { max-height: 140px; }
}
@media (prefers-reduced-motion: reduce) {
  .memory-card { animation: none !important; display: none; }
}



/* объёмная сцена: конверт лежит под углом к зрителю, словно предмет на столе. */
.scene { perspective: 1100px; perspective-origin: 50% 42%; }
.envelope {
  transform: translate(-50%, -50%) rotatex(16deg) rotatez(-4deg);
  transform-style: preserve-3d;
  filter: drop-shadow(0 32px 22px rgba(0,0,0,.58)) drop-shadow(0 0 14px rgba(255,80,150,.08));
}
.env-back {
  transform: translatez(-10px);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.72), inset 0 -9px 14px rgba(77,15,49,.24), 0 12px 0 -4px #743a5a;
}
.letter {
  transform: translatez(3px);
  box-shadow: 0 10px 18px rgba(41,9,35,.32), inset 0 1px 0 rgba(255,255,255,.9), inset 0 -4px 9px rgba(175,83,128,.12);
}
.env-front {
  transform: translatez(8px);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.75), inset 0 -12px 18px rgba(128,44,83,.18);
}
.env-fold {
  transform: translatez(11px);
  filter: drop-shadow(0 -2px 2px rgba(255,255,255,.25));
}
.env-flap {
  transform: translatez(14px);
  filter: drop-shadow(0 5px 3px rgba(85,24,55,.18));
}
.seal {
  transform: translate(-50%, -50%) translatez(20px);
  box-shadow: 0 9px 0 -3px #8f164e, 0 14px 20px rgba(40,0,20,.42), inset 0 3px 5px rgba(255,255,255,.7), inset 0 -7px 10px rgba(95,0,39,.32);
}
.envelope:hover { transform: translate(-50%, -53%) rotatex(12deg) rotatez(-2deg) scale(1.025); }
.envelope:hover .seal { transform: translate(-50%, -50%) translatez(20px) scale(1.07); }
.opened .envelope { transform: translate(-50%, 75%) scale(.82) rotatex(16deg) rotatez(-5deg); }
.opened .env-flap { transform: translatez(14px) rotatex(180deg); }
.opened .seal { transform: translate(-50%, -50%) translatez(20px) scale(.25) rotate(25deg); }

/* сердце — глянцевое, с боковой глубиной и мягкой падающей тенью. */
.heart-scene {
  filter: drop-shadow(0 15px 7px rgba(65,0,30,.42))
          drop-shadow(0 5px 0 rgba(160,18,78,.55))
          drop-shadow(0 0 24px rgba(255,54,137,.5));
}
.heart-fill {
  filter: drop-shadow(0 -1px 1px rgba(255,255,255,.72));
  paint-order: stroke fill;
  stroke: rgba(255,178,211,.42);
  stroke-width: 1.1px;
}
.heart-svg { transform: rotate(-2deg); }

/* лепестки и сердцевины выглядят как отдельные выпуклые слои. */
.flower {
  filter: drop-shadow(0 10px 5px rgba(0,0,0,.32)) drop-shadow(0 0 8px rgba(255,120,180,.18));
}
.flower .petal-a {
  stroke: rgba(117,28,72,.34);
  stroke-width: 1.4;
  filter: drop-shadow(0 2px 1px rgba(99,20,60,.26));
}
.flower .petal-b {
  stroke: rgba(255,255,255,.48);
  stroke-width: 1.1;
  filter: drop-shadow(0 -1px 1px rgba(255,255,255,.42));
}
.flower .center {
  stroke: rgba(255,255,255,.72);
  stroke-width: 1.5;
  filter: drop-shadow(0 2px 2px rgba(116,51,22,.4));
}
.stem-line { filter: drop-shadow(1px 2px 1px rgba(0,0,0,.35)); }
.leaf-shape { stroke: rgba(18,77,52,.4); stroke-width: .8; filter: drop-shadow(1px 2px 1px rgba(0,0,0,.25)); }



/* фотореалистичная доводка: матовая бумага, мягкие контактные тени и блики. */
.envelope {
  filter: drop-shadow(0 38px 28px rgba(0,0,0,.72))
          drop-shadow(0 14px 12px rgba(0,0,0,.48))
          drop-shadow(0 0 20px rgba(255,80,150,.10));
  transition: transform 1.1s cubic-bezier(.2,.75,.2,1), filter .8s ease, opacity .8s ease;
}
.env-back, .env-front, .env-fold, .env-flap {
  background-blend-mode: multiply, normal;
  backface-visibility: hidden;
}
.env-back {
  background-image: linear-gradient(145deg, #f8dce8 0%, #e8b8ce 42%, #b96d92 100%);
  box-shadow: inset 0 2px 1px rgba(255,255,255,.92),
    inset 0 -14px 20px rgba(80,16,49,.24),
    inset 8px 0 14px rgba(255,255,255,.18), 0 12px 0 -4px #71324f;
}
.env-front {
  background-image: linear-gradient(135deg, #fff0f5 0%, #f4c9dc 35%, #d995b7 100%);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.96),
    inset 0 -16px 20px rgba(112,31,70,.18),
    inset 1px 0 0 rgba(255,255,255,.6);
}
.env-front::after, .env-flap::after, .letter::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: .15;
  background-image: repeating-linear-gradient(0deg, rgba(95,38,65,.12) 0 1px, transparent 1px 3px),
                    repeating-linear-gradient(90deg, rgba(255,255,255,.22) 0 1px, transparent 1px 4px);
  mix-blend-mode: soft-light;
}
.env-fold {
  filter: drop-shadow(0 3px 2px rgba(91,23,56,.28));
}
.env-flap {
  background-image: linear-gradient(155deg, #fff0f6 0%, #efc2d6 46%, #d68eaf 100%);
  filter: drop-shadow(0 8px 5px rgba(70,12,43,.28));
  transform-origin: 50% 0%;
}
.letter {
  background-image: linear-gradient(150deg, #fffdfd 0%, #fff5f8 58%, #f5dbe7 100%);
  box-shadow: 0 16px 24px rgba(20,0,14,.38), inset 0 1px 0 #fff,
              inset 0 -5px 12px rgba(175,83,128,.13);
}
.seal {
  background-image: radial-gradient(ellipse at 32% 22%, #ffb8d6 0%, #f05c9c 28%, #bd2468 62%, #79113f 100%);
  border: 1px solid rgba(255,214,234,.72);
  box-shadow: 0 2px 0 rgba(255,255,255,.35) inset,
    0 4px 0 #8f164e, 0 8px 0 -2px #641037,
    0 17px 22px rgba(40,0,20,.48), inset 0 -7px 10px rgba(95,0,39,.38);
}
/* сердце: глянцевый объём с направленным бликом и более глубокой тенью. */
.heart-scene {
  filter: drop-shadow(0 19px 9px rgba(0,0,0,.48))
          drop-shadow(0 5px 0 rgba(135,10,65,.62))
          drop-shadow(0 0 30px rgba(255,54,137,.56));
}
.heart-fill {
  stroke: rgba(255,222,236,.68) !important;
  stroke-width: 1.6px !important;
  filter: drop-shadow(0 2px 1px rgba(255,255,255,.68))
          drop-shadow(0 -4px 6px rgba(255,255,255,.15));
}
.heart-svg { overflow: visible; }
/* у цветов добавлены объёмные кромки, контактные тени и мягкий сатиновый блеск. */
.flower {
  filter: drop-shadow(0 13px 7px rgba(0,0,0,.38))
          drop-shadow(0 2px 1px rgba(0,0,0,.25))
          drop-shadow(0 0 10px rgba(255,120,180,.2));
}
.flower .petal-a {
  stroke: rgba(100,18,57,.42);
  stroke-width: 1.7;
  filter: drop-shadow(0 3px 2px rgba(80,10,45,.3));
}
.flower .petal-b {
  stroke: rgba(255,255,255,.62);
  stroke-width: 1.3;
  filter: drop-shadow(0 -2px 1px rgba(255,255,255,.45))
          drop-shadow(1px 2px 1px rgba(105,22,60,.2));
}
.flower .center {
  fill: radial-gradient(circle at 35% 28%, #fff4c9, #f7c86d 55%, #bd7b38);
  stroke: rgba(255,255,255,.85);
  stroke-width: 1.7;
  filter: drop-shadow(0 3px 2px rgba(83,38,12,.48));
}
.stem-line { filter: drop-shadow(1px 3px 1px rgba(0,0,0,.42)); }
.leaf-shape { stroke: rgba(18,77,52,.55); stroke-width: 1; filter: drop-shadow(1px 3px 2px rgba(0,0,0,.3)); }
@media (prefers-reduced-motion: reduce) {
  .envelope { transition-duration: .01ms; }
}


/* реалистичная предметная подача: физические материалы, фаски, отражённый свет и контактные тени */
.scene { perspective: 1450px; perspective-origin: 50% 48%; }
.envelope {
  transform-style: preserve-3d;
  filter: drop-shadow(0 36px 26px rgba(0,0,0,.58)) drop-shadow(0 8px 18px rgba(255,70,145,.12));
  background:
    linear-gradient(148deg, rgba(255,255,255,.2), transparent 18%),
    linear-gradient(320deg, #7f244b 0%, #c95a82 26%, #f5b4ca 48%, #b84b78 72%, #68203f 100%);
  border: 1px solid rgba(255,230,240,.45);
  box-shadow: inset 0 2px 2px rgba(255,255,255,.5),
              inset 0 -7px 12px rgba(35,0,17,.38),
              inset 8px 0 14px rgba(255,255,255,.1),
              0 26px 40px rgba(0,0,0,.45);
}
.env-back {
  transform: translatez(-5px);
  background:
    repeating-linear-gradient(0deg, rgba(255,255,255,.018) 0 1px, transparent 1px 4px),
    linear-gradient(135deg,#f8c5d7,#b54c76 55%,#722542);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.18), 0 10px 16px rgba(0,0,0,.2);
}
.env-front {
  transform: translatez(8px);
  background:
    linear-gradient(135deg, rgba(255,255,255,.24), transparent 30%),
    linear-gradient(155deg,#f4b2c9 0%,#d8799d 42%,#a64068 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.55), inset 0 -8px 12px rgba(67,0,27,.22);
}
.env-fold {
  transform: translatez(10px);
  filter: drop-shadow(0 2px 2px rgba(38,0,16,.4));
}
.env-flap {
  transform: translatez(13px);
  background:
    linear-gradient(165deg, rgba(255,255,255,.3), transparent 42%),
    linear-gradient(145deg,#ffd8e5 0%,#d8789b 48%,#873052 100%);
  box-shadow: inset 0 1px 1px rgba(255,255,255,.6), 0 5px 8px rgba(35,0,17,.25);
}
.letter {
  transform: translatez(2px);
  background:
    repeating-linear-gradient(0deg, rgba(120,55,80,.025) 0 1px, transparent 1px 5px),
    linear-gradient(135deg,#fffafc,#f6e6ed 70%,#e8d1dc);
  box-shadow: inset 0 0 0 1px rgba(255,255,255,.95), 0 8px 18px rgba(0,0,0,.22);
}
.seal {
  transform: translate(-50%,-50%) translatez(24px);
  background:
    radial-gradient(ellipse at 32% 24%, rgba(255,255,255,.9), transparent 18%),
    radial-gradient(ellipse at 36% 28%, #ffb7d2 0%, #c52d68 34%, #78123f 69%, #400b2b 100%);
  border: 1px solid rgba(255,224,239,.7);
  box-shadow: inset 0 3px 5px rgba(255,255,255,.42), inset 0 -5px 8px rgba(28,0,17,.6),
              0 5px 0 #4b0b2b, 0 10px 15px rgba(0,0,0,.45), 0 0 24px rgba(255,58,143,.2);
}
.seal svg { filter: drop-shadow(0 1px 1px rgba(255,255,255,.55)) drop-shadow(0 2px 2px rgba(40,0,20,.45)); }
.heart-scene {
  filter: drop-shadow(0 18px 12px rgba(0,0,0,.38)) drop-shadow(0 0 28px rgba(255,36,125,.34));
  transform-style: preserve-3d;
}
.heart-svg { filter: drop-shadow(0 2px 0 rgba(255,255,255,.42)) drop-shadow(0 9px 8px rgba(73,0,33,.42)); }
.heart-fill {
  stroke: rgba(255,224,239,.92);
  stroke-width: 1.7px;
  paint-order: stroke fill;
  filter: drop-shadow(0 2px 1px rgba(255,255,255,.5)) drop-shadow(0 -5px 4px rgba(115,0,48,.32));
}
.flower {
  filter: drop-shadow(0 12px 8px rgba(0,0,0,.42)) drop-shadow(0 0 10px rgba(255,135,190,.15));
  transform-style: preserve-3d;
}
.flower svg { overflow: visible; }
.flower .petal-a {
  stroke: rgba(255,255,255,.38);
  stroke-width: .9px;
  filter: drop-shadow(0 2px 1px rgba(255,255,255,.38)) drop-shadow(0 5px 3px rgba(60,0,28,.32));
}
.flower .petal-b {
  stroke: rgba(255,255,255,.55);
  stroke-width: .7px;
  filter: drop-shadow(0 1px 1px rgba(255,255,255,.55)) drop-shadow(0 3px 2px rgba(70,0,30,.28));
}
.flower .center {
  stroke: rgba(255,245,200,.9);
  stroke-width: 1.3px;
  filter: drop-shadow(0 2px 2px rgba(55,0,22,.4));
}
.stem-art { filter: drop-shadow(0 3px 2px rgba(0,0,0,.38)); }
.leaf-shape { filter: drop-shadow(0 2px 1px rgba(0,0,0,.28)); }
@media (max-width: 600px) {
  .scene { perspective: 1000px; }
}

</style>
</head>

<div class="particle-layer" id="particles" aria-hidden="true"></div>
<script>
(() => {
  const stage = document.getelementbyid('stage');
  const envelope = document.getelementbyid('envelope');
  const particles = document.getelementbyid('particles');
  let opened = false;
  function sparkleburst() {
    const count = 24;
    for (let i = 0; i < count; i++) {
      const p = document.createElement('i');
      p.className = 'particle';
      p.style.setProperty('--x', (38 + Math.random() * 24) + 'vw');
      p.style.setProperty('--y', (30 + Math.random() * 30) + 'vh');
      p.style.setProperty('--s', (3 + Math.random() * 5) + 'px');
      p.style.setProperty('--dur', (1.2 + Math.random() * 1.2) + 's');
      p.style.setProperty('--delay', (Math.random() * .7) + 's');
      particles.appendChild(p);
      setTimeout(() => p.remove(), 3200);
    }
  }
  function openLetter() {
    if (opened) return;
    opened = true;
    stage.classList.add('opened');
    document.body.classList.add('opened-page');
    envelope.setAttribute('aria-label', 'Письмо открыто');
    sparkleBurst();
  }
  envelope.addEventListener('click', openLetter);
  envelope.addEventListener('keydown', event => {
    if (event.key === 'enter' || event.key === ' ') {
      event.preventdefault();
      openletter();
    }
  });
})();
</script>
